<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Fire Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static',filename='css/style.css') }}">
</head>

<body>

<nav>
    <div class="logo">
        🌲 Forest Fire Predictor
    </div>
</nav>

<div class="container">

<div class="left">

<h1>Forest Fire Weather Index</h1>

<p>
Predict the Fire Weather Index using weather conditions
and forest parameters with Machine Learning.
</p>

<img src="{{ url_for('static',filename='images/forest.jpg') }}">

</div>

<div class="right">

<h2>Prediction Form</h2>

<form action="{{ url_for('predict_datapoint') }}" method="post">

<input type="number" name="day" placeholder="Day (1-31)" min="1" max="31" required>

<input type="number" name="month" placeholder="Month (1-12)" min="1" max="12" required>

<input type="number" name="year" value="2012" readonly>

<input type="number" step="0.1" name="Temperature" placeholder="Temperature">

<input type="number" step="0.1" name="RH" placeholder="Relative Humidity">

<input type="number" step="0.1" name="Ws" placeholder="Wind Speed">

<input type="number" step="0.1" name="Rain" placeholder="Rain">

<input type="number" step="0.1" name="FFMC" placeholder="FFMC">

<input type="number" step="0.1" name="DMC" placeholder="DMC">

<input type="number" step="0.1" name="DC" placeholder="DC">

<input type="number" step="0.1" name="ISI" placeholder="ISI">

<input type="number" step="0.1" name="BUI" placeholder="BUI">

<select name="Region">
<option value="0">Bejaia</option>
<option value="1">Sidi Bel-Abbes</option>
</select>

<select name="Classes">
<option value="fire">Fire</option>
<option value="not fire">Not Fire</option>
</select>

<button type="submit">
Predict FWI
</button>

</form>
{% if results %}

<div class="result">

    <h2>🔥 Predicted FWI : {{ results }}</h2>

    <h2>
        Fire Danger Level :
        <span class="danger">{{ danger }}</span>
    </h2>

</div>
{% endif %}

</div>

</div>

</body>
</html>
