<!DOCTYPE html>
<html>
<head>
    <title>Forest Fire FWI Prediction</title>
</head>
<body>

<div class="login">
    <h1>Forest Fire Weather Index (FWI) Prediction</h1>

    <form action="{{ url_for('predict_datapoint') }}" method="post">

        <div class="mb-3">
            <label>Day</label>
            <input class="form-control" type="number" name="day" required>
        </div>

        <div class="mb-3">
            <label>Month</label>
            <input class="form-control" type="number" name="month" required>
        </div>

        <div class="mb-3">
            <label>Year</label>
            <input class="form-control" type="number" name="year" required>
        </div>

        <div class="mb-3">
            <label>Temperature (°C)</label>
            <input class="form-control" type="number" step="0.1" name="Temperature" required>
        </div>

        <div class="mb-3">
            <label>Relative Humidity (RH)</label>
            <input class="form-control" type="number" step="0.1" name="RH" required>
        </div>

        <div class="mb-3">
            <label>Wind Speed (Ws)</label>
            <input class="form-control" type="number" step="0.1" name="Ws" required>
        </div>

        <div class="mb-3">
            <label>Rain</label>
            <input class="form-control" type="number" step="0.1" name="Rain" required>
        </div>

        <div class="mb-3">
            <label>FFMC</label>
            <input class="form-control" type="number" step="0.1" name="FFMC" required>
        </div>

        <div class="mb-3">
            <label>DMC</label>
            <input class="form-control" type="number" step="0.1" name="DMC" required>
        </div>

        <div class="mb-3">
            <label>DC</label>
            <input class="form-control" type="number" step="0.1" name="DC" required>
        </div>

        <div class="mb-3">
            <label>ISI</label>
            <input class="form-control" type="number" step="0.1" name="ISI" required>
        </div>

        <div class="mb-3">
            <label>BUI</label>
            <input class="form-control" type="number" step="0.1" name="BUI" required>
        </div>

        <div class="mb-3">
            <label>Region</label>
            <select class="form-control" name="Region" required>
                <option selected disabled>Select Region</option>
                <option value="0">Bejaia</option>
                <option value="1">Sidi Bel-Abbes</option>
            </select>
        </div>

        <div class="mb-3">
            <label>Classes</label>
            <select class="form-control" name="Classes" required>
                <option selected disabled>Select Class</option>
                <option value="fire">Fire</option>
                <option value="not fire">Not Fire</option>
            </select>
        </div>

        <div class="mb-3">
            <input class="btn btn-primary" type="submit" value="Predict FWI">
        </div>

    </form>

    <h2>
        Predicted FWI : {{ results }}
    </h2>

</div>

</body>
</html>
